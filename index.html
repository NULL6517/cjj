<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>不开心回收站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #1b1b3a 0%, #0d0d1f 60%, #05050d 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .box {
    text-align: center;
    padding: 32px 22px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    max-width: 360px;
    width: 100%;
    z-index: 10;
    position: relative;
  }
  h1 { color: #ffd369; font-size: 20px; margin-bottom: 10px; letter-spacing: 1px; }
  p.sub {
    color: #a8b2c1; font-size: 13px; line-height: 1.7; margin-bottom: 24px;
  }
  .btn {
    display: inline-block; padding: 15px 32px; font-size: 16px;
    color: #1a1a2e; background: #ffd369; border: none; border-radius: 50px;
    cursor: pointer; font-weight: bold; width: 100%;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 18px rgba(255,211,105,0.3);
  }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: .5; }
  #result {
    margin-top: 20px; color: #7ee787; font-size: 14px; line-height: 1.7;
    min-height: 22px; opacity: 0; transition: opacity .5s;
  }
  #result.show { opacity: 1; }

  /* 特效层：固定满屏，不挡点击 */
  #fx-layer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 50;
    overflow: hidden;
  }

  /* 彩带 */
  .confetti {
    position: absolute;
    top: -30px;
    width: 8px;
    height: 16px;
    opacity: 0;
    animation: confettiFall linear forwards;
    will-change: transform;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.85; }
  }

  /* 烟花火花 */
  .spark {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    animation: sparkFly 1.1s ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes sparkFly {
    0%   { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.1); opacity: 0; }
  }

  /* 闪光圈 */
  .flash-ring {
    position: absolute;
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 3px solid #fff;
    transform: translate(-50%, -50%) scale(0.2);
    animation: ringExpand 0.7s ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes ringExpand {
    0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 1; box-shadow: 0 0 30px #fff; }
    100% { transform: translate(-50%, -50%) scale(5); opacity: 0; box-shadow: 0 0 50px transparent; }
  }

  /* 爆竹拖尾 */
  .cracker-trail {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #ffd369;
    box-shadow: 0 0 8px #ffd369;
    animation: crackerTrail 0.6s linear forwards;
    will-change: transform, opacity;
  }
  @keyframes crackerTrail {
    0%   { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-60vh); opacity: 0; }
  }

  /* 飘字 */
  .word-fall {
    position: absolute;
    top: -100px;
    font-weight: bold;
    white-space: nowrap;
    animation: wordFall linear forwards;
    will-change: transform, opacity;
  }
  @keyframes wordFall {
    0%   { transform: translateY(0) scale(0.6) rotate(-4deg); opacity: 0; }
    8%   { opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(115vh) scale(1.1) rotate(4deg); opacity: 0; }
  }
</style>
</head>
<body>

<div id="fx-layer"></div>

<div class="box">
  <h1>🗑️ 不开心回收站</h1>
  <p class="sub">
    本回收站已上线，专门回收各种不开心。<br>
    请把今天那点破事儿丢进来，<br>
    本站承诺：概不退还，直接粉碎。
  </p>
  <button class="btn" id="btn">一键回收不开心</button>
  <div id="result"></div>
</div>

<script>
  const btn = document.getElementById('btn');
  const result = document.getElementById('result');
  const layer = document.getElementById('fx-layer');

  const COLORS = ['#ffd369','#ff6b9d','#7ee787','#5ec8ff','#c792ea','#ff9f43','#ff4d6d','#fff45e','#6bf0ff','#ffffff'];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // 视口尺寸（手机用）
  function vw() { return window.innerWidth; }
  function vh() { return window.innerHeight; }

  // ===== 彩带 =====
  function spawnConfetti(count) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = rand(0, 100) + 'vw';
      el.style.background = pick(COLORS);
      el.style.width = rand(5, 10) + 'px';
      el.style.height = rand(10, 20) + 'px';
      el.style.animationDuration = rand(2.2, 4) + 's';
      el.style.animationDelay = rand(0, 1.2) + 's';
      el.style.borderRadius = Math.random() < 0.3 ? '50%' : '2px';
      layer.appendChild(el);
      setTimeout(() => el.remove(), 6500);
    }
  }

  // ===== 烟花 =====
  function burstFirework(x, y, big) {
    const color1 = pick(COLORS);
    const color2 = pick(COLORS);
    const num = big ? 28 : 16;
    const dist = big ? rand(120, 200) : rand(80, 130);

    // 闪光圈
    const ring = document.createElement('div');
    ring.className = 'flash-ring';
    ring.style.left = x + 'px';
    ring.style.top = y + 'px';
    ring.style.borderColor = color1;
    layer.appendChild(ring);
    setTimeout(() => ring.remove(), 800);

    // 火花
    for (let i = 0; i < num; i++) {
      const angle = (Math.PI * 2 * i) / num + rand(-0.1, 0.1);
      const d = dist * rand(0.6, 1);
      const el = document.createElement('div');
      el.className = 'spark';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      const c = Math.random() < 0.5 ? color1 : color2;
      el.style.background = c;
      el.style.boxShadow = `0 0 10px ${c}, 0 0 20px ${c}`;
      el.style.setProperty('--dx', Math.cos(angle) * d + 'px');
      el.style.setProperty('--dy', (Math.sin(angle) * d + 60) + 'px');
      el.style.animationDuration = rand(0.9, 1.3) + 's';
      layer.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }
  }

  // ===== 爆竹 =====
  function fireCracker() {
    const startXPercent = rand(10, 90);
    const startY = vh();
    const targetY = rand(0.15, 0.45) * vh();
    const duration = 600;

    // 拖尾
    let trailCount = 0;
    const trailTimer = setInterval(() => {
      const t = document.createElement('div');
      t.className = 'cracker-trail';
      t.style.left = startXPercent + 'vw';
      t.style.top = startY + 'px';
      layer.appendChild(t);
      setTimeout(() => t.remove(), 700);
      trailCount++;
      if (trailCount > 8) clearInterval(trailTimer);
    }, 50);

    // 冲上去的亮点
    const dot = document.createElement('div');
    dot.style.cssText = `
      position:absolute; left:${startXPercent}vw; top:${startY}px;
      width:9px; height:9px; border-radius:50%;
      background:#fff; box-shadow:0 0 14px #ffd369, 0 0 28px #ff9f43;
      transition: top ${duration}ms cubic-bezier(.2,.7,.4,1);
      z-index: 2;
    `;
    layer.appendChild(dot);

    requestAnimationFrame(() => {
      dot.style.top = targetY + 'px';
    });

    setTimeout(() => {
      dot.remove();
      burstFirework(startXPercent / 100 * vw(), targetY, Math.random() < 0.6);
    }, duration + 30);
  }

  // ===== 飘字 =====
  const words = [
    '陈佳静 别难过','陈佳静 开心点','不开心统统粉碎','烦恼退散',
    '今天也要笑','你超棒的','好运正在赶来','别想了 吃点好的',
    '坏心情 拜拜','一切都会好的','你值得所有开心','冲鸭 别emo',
    '笑一个吧','明天更晴朗','烦心事 走开'
  ];

  function spawnWord(text, size, color, dur) {
    const el = document.createElement('div');
    el.className = 'word-fall';
    el.textContent = text;
    el.style.left = rand(2, 60) + 'vw';
    el.style.fontSize = size + 'px';
    el.style.color = color;
    el.style.textShadow = `0 0 10px ${color}, 0 0 22px ${color}`;
    el.style.animationDuration = dur + 's';
    layer.appendChild(el);
    setTimeout(() => el.remove(), (dur + 1) * 1000);
  }

  function dropWords() {
    ['陈佳静 别难过', '陈佳静 开心点'].forEach((t, idx) => {
      setTimeout(() => spawnWord(t, rand(28, 38), '#ffd369', 3.4), idx * 350);
    });
    let n = 0;
    const timer = setInterval(() => {
      spawnWord(pick(words), rand(16, 30), pick(COLORS), rand(3, 5));
      n++;
      if (n >= 24) clearInterval(timer);
    }, 200);
  }

  // ===== 全屏演出 =====
  function fullScreenShow() {
    spawnConfetti(60);

    for (let i = 0; i < 8; i++) {
      setTimeout(() => {
        burstFirework(rand(0.1, 0.9) * vw(), rand(0.1, 0.55) * vh(), true);
      }, i * 200);
    }

    for (let i = 0; i < 8; i++) {
      setTimeout(() => fireCracker(), 1200 + i * 300);
    }

    setTimeout(() => {
      const spots = [
        [0.2, 0.25], [0.5, 0.18], [0.8, 0.28],
        [0.35, 0.4], [0.65, 0.38], [0.5, 0.5]
      ];
      spots.forEach(([rx, ry], idx) => {
        setTimeout(() => {
          burstFirework(rx * vw(), ry * vh(), true);
        }, idx * 150);
      });
      spawnConfetti(40);
    }, 4000);
  }

  let count = 0;

  btn.addEventListener('click', () => {
    count++;
    const msgs = [
      '回收成功！不开心已粉碎，查无此物。',
      '已处理。剩余情绪：开心 × 100%。',
      '报告：检测到一丝烦躁，已顺手清空。'
    ];
    result.textContent = msgs[Math.min(count - 1, msgs.length - 1)];
    result.classList.add('show');

    dropWords();
    fullScreenShow();

    if (count >= 3) {
      btn.disabled = true;
      btn.textContent = '已清空 ✓';
      result.textContent = '好了，别点了，真没了。该吃吃该喝喝，有事喊我。';
    }
  });
</script>

</body>
</html>
